name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck bin/*.sh tests/*.sh

  tests:
    name: Behavior tests
    runs-on: ubuntu-latest
    # The suite should finish in ~2-3 minutes; this generous cap fails loudly on a
    # hung watcher or tmux test instead of riding GitHub's 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      - run: |
          set -eu
          for test_script in tests/*.test.sh; do
            "$test_script"
          done

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Symlinks must stay intact
        run: |
          set -eu
          [ "$(readlink CLAUDE.md)" = "AGENTS.md" ] || { echo "::error::CLAUDE.md must be a symlink to AGENTS.md"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
      # A stray file at the repo root is obvious once seen and invisible otherwise:
      # the lint job globs bin/ and tests/, the test job globs tests/*.test.sh, and
      # nothing else looks here. A mis-quoted shell redirect once committed an 82KB
      # duplicate of the test suite named `rite_brief() {,+14p` and every job passed.
      # New root files are rare and deliberate, so the allowlist is cheap to extend.
      - name: Repo root must carry only its known files
        run: |
          set -eu
          unexpected=$(git ls-files | grep -v / | grep -vxF -e .gitignore \
            -e .no-mistakes.yaml -e .tasks.toml -e AGENTS.md -e CLAUDE.md \
            -e CONTRIBUTING.md -e LICENSE -e README.md || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected tracked files at the repo root:"
            printf '%s\n' "$unexpected"
            echo "Remove them, or add them to the allowlist in this job if they belong here."
            exit 1
          fi
